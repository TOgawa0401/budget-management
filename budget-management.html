// ===== ヘルパー =====
const fmt = (n) => '¥' + Math.abs(n || 0).toLocaleString('ja-JP');
const fmtDiff = (n) => {
  if (n === 0) return '±0';
  return (n > 0 ? '+¥' : '-¥') + Math.abs(n).toLocaleString('ja-JP');
};
const pct = (a, b) => (b > 0 ? Math.min(100, Math.round((a / b) * 100)) : 0);
const toNum = (v) => {
  const s = String(v).replace(/,/g, '').trim();
  return s === '' ? 0 : isNaN(Number(s)) ? 0 : Number(s);
};
const nextId = (cases) => Math.max(0, ...cases.map((c) => c.id)) + 1;
const fmtDate = (dateStr) => {
  if (!dateStr) return '—';
  return String(dateStr).split('T')[0]; // 日付部分のみ抽出（YYYY-MM-DD）
};

// ===== GAS API =====
const fetchFromGAS = async () => {
  try {
    const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=getAll`);
    if (!response.ok) throw new Error('API response error');
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'API error');
    return result.data || [];
  } catch (error) {
    console.error('Failed to fetch from GAS:', error);
    throw error;
  }
};

const addToGAS = async (data) => {
  try {
    const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=add`, {
      method: 'POST',
      body: JSON.stringify(data),
    });
    if (!response.ok) throw new Error('API response error');
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'API error');
    return result.data;
  } catch (error) {
    console.error('Failed to add to GAS:', error);
    throw error;
  }
};

const updateInGAS = async (data) => {
  try {
    const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=update`, {
      method: 'POST',
      body: JSON.stringify(data),
    });
    if (!response.ok) throw new Error('API response error');
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'API error');
    return result.data;
  } catch (error) {
    console.error('Failed to update in GAS:', error);
    throw error;
  }
};

const deleteFromGAS = async (id) => {
  try {
    const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=delete`, {
      method: 'POST',
      body: JSON.stringify({ id }),
    });
    if (!response.ok) throw new Error('API response error');
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'API error');
    return result.data;
  } catch (error) {
    console.error('Failed to delete from GAS:', error);
    throw error;
  }
};

// ===== ProgressBar =====
function ProgressBar({ label, value, max, color }) {
  const p = pct(value, max);
  return (
    <div style={{ marginBottom: '14px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
        <span style={{ fontSize: '12px', color: C.muted }}>{label}</span>
        <span style={{ fontSize: '12px', color: C.txt, fontWeight: 600 }}>{p}%</span>
      </div>
      <div style={{ height: '6px', background: C.bg, borderRadius: '3px', overflow: 'hidden' }}>
        <div style={{
          height: '100%', width: `${p}%`, background: color,
          borderRadius: '3px', transition: 'width 0.4s ease',
        }} />
      </div>
    </div>
  );
}

function FormModal({ initial, onSave, onClose }) {
  const [form, setForm] = useState(() =>
    initial
      ? { ...initial, budget26: initial.budget26 || '', actual: initial.actual || '', forecast: initial.forecast || '' }
      : { ...EMPTY_FORM }
  );

  const isEdit = !!initial;

  const handleSave = async () => {
    if (!form.name.trim()) { alert('案件名を入力してください'); return; }
    setIsSaving(true);
    try {
      await onSave({
        ...form,
        budget26: toNum(form.budget26),
        actual:   toNum(form.actual),
        forecast: toNum(form.forecast),
        priority: form.category === 'コストセンター原価' ? '-' : form.priority,
      });
    } finally {
      setIsSaving(false);
    }
  };

  const col2 = { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' };
  const fLabel = { fontSize: '12px', color: C.muted, marginBottom: '5px', display: 'block' };

  return (
    <div
      style={{
        position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.72)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 1000, padding: '20px',
      }}
    >

        background: C.surface, border: `1px solid ${C.border}`,
        borderRadius: '16px', width: '100%', maxWidth: '600px',
        maxHeight: '90vh', overflowY: 'auto', padding: '28px',

            {isEdit ? '案件を編集' : '案件を追加'}
          </h2>
          <button onClick={onClose} style={{ ...btnStyle('#334155'), padding: '4px 12px' }}>✕</button>
        </div>

        <div style={{ display: 'grid', gap: '16px' }}>
          {/* カテゴリ */}
          <div>
            <label style={fLabel}>カテゴリ</label>
            <select style={selectStyle} value={form.category} onChange={set('category')}>
              {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          {/* 案件名 */}
          <div>
            <label style={fLabel}>案件名 *</label>
            <input style={inputStyle} value={form.name} onChange={set('name')} placeholder="案件名を入力" />
          </div>

          {/* 執行日・担当者 */}
          <div style={col2}>
            <div>
              <label style={fLabel}>執行日</label>
              <input type="date" style={inputStyle} value={form.executionDate} onChange={set('executionDate')} />
            </div>
            <div>
              <label style={fLabel}>担当者</label>
              <input style={inputStyle} value={form.responsible} onChange={set('responsible')} placeholder="担当者を入力" />
            </div>
          </div>

          {/* 26年度予算承認額 */}
          <div>
            <label style={fLabel}>26年度予算承認額</label>
            <input style={inputStyle} value={form.budget26} onChange={set('budget26')} placeholder="0" />
          </div>

          {/* 実績・見込 */}
          <div style={col2}>
            <div>
              <label style={fLabel}>実績</label>
              <input style={inputStyle} value={form.actual} onChange={set('actual')} placeholder="0" />
            </div>

// ===== DeleteModal =====
function DeleteModal({ caseName, onConfirm, onClose }) {
  const [isDeleting, setIsDeleting] = useState(false);

  const handleConfirm = async () => {
    setIsDeleting(true);
    try {
      await onConfirm();
    } finally {
      setIsDeleting(false);
    }
  };

  return (
    <div
      style={{
        position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.72)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 1000, padding: '20px',
      }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div style={{
        background: C.surface, border: `1px solid ${C.border}`,
        borderRadius: '16px', width: '100%', maxWidth: '400px',
        padding: '32px', textAlign: 'center',

        <h2 style={{ fontSize: '17px', fontWeight: 700, color: C.txt, marginBottom: '10px' }}>

        <p style={{ color: C.muted, fontSize: '14px', marginBottom: '24px', lineHeight: 1.6 }}>
          「{caseName}」を削除します。<br />この操作は取り消せません。

        <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
          <button onClick={onClose} disabled={isDeleting} style={{ ...btnStyle('#334155'), opacity: isDeleting ? 0.5 : 1 }}>キャンセル</button>

                    <div style={{ fontWeight: 600, color: C.txt, marginBottom: '3px' }}>{c.name}</div>
                    {c.details && (
                      <div style={{ fontSize: '11px', color: C.dim, lineHeight: 1.5 }}>{c.details}</div>
                    )}
                  </td>
                  <td style={{ ...tdStyle, textAlign: 'right', color: C.muted }}>
                    {c.budget26 ? fmt(c.budget26) : '—'}
                  </td>
                  <td style={{ ...tdStyle, textAlign: 'right', color: C.green, fontWeight: c.actual ? 600 : 400 }}>
                    {c.actual ? fmt(c.actual) : '—'}
                  </td>
                  <td style={{ ...tdStyle, textAlign: 'right', color: C.blue }}>
                    {c.forecast ? fmt(c.forecast) : '—'}
                  </td>
                  <td style={{ ...tdStyle, textAlign: 'right', color: diffColor, fontWeight: 600 }}>
                    {isReadOnly ? '—' : fmtDiff(diff)}
                  </td>
                  <td style={{ ...tdStyle, color: C.muted, fontSize: '12px', whiteSpace: 'nowrap' }}>
                    {c.responsible || '—'}
                  </td>
                  <td style={{ ...tdStyle, color: C.muted, fontSize: '12px', whiteSpace: 'nowrap' }}>
                    {fmtDate(c.executionDate)}
                  </td>
                  <td style={{ ...tdStyle, whiteSpace: 'nowrap' }}>
                    <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                      <a
                        href={c.proposalUrl || '#'}
                        target={c.proposalUrl ? '_blank' : undefined}
                        rel={c.proposalUrl ? 'noopener noreferrer' : undefined}
                        onClick={(e) => !c.proposalUrl && e.preventDefault()}
                        style={{
                          padding: '4px 10px',
                          fontSize: '12px',
                          borderRadius: '4px',
                          background: c.proposalUrl ? '#5b21b6' : '#2d3748',
                          color: c.proposalUrl ? '#e9d5ff' : '#8b8b9a',
                          textDecoration: 'none',
                          cursor: c.proposalUrl ? 'pointer' : 'not-allowed',
                          opacity: c.proposalUrl ? 1 : 0.5,
                          transition: 'all 0.2s',
                          display: 'inline-block',
                        }}
                        onMouseEnter={(e) => {
                          if (c.proposalUrl) {
                            e.currentTarget.style.background = '#7c3aed';
                            e.currentTarget.style.color = '#f3e8ff';
                          }
                        }}
                        onMouseLeave={(e) => {
                          e.currentTarget.style.background = c.proposalUrl ? '#5b21b6' : '#2d3748';
                          e.currentTarget.style.color = c.proposalUrl ? '#e9d5ff' : '#8b8b9a';
                        }}
                      >
                        稟議ページ
                      </a>
                      {!isReadOnly && (
                        <>
                          <button
                            onClick={() => onEdit(c)}
                            style={{ ...btnStyle('#334155'), padding: '4px 10px', fontSize: '12px' }}
                          >
                            編集
                          </button>
                          <button
                            onClick={() => onDelete(c)}
                            style={{ ...btnStyle('#3b0f0f'), padding: '4px 10px', fontSize: '12px', color: '#fca5a5' }}
                          >
                            削除
                          </button>
                        </>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ===== メインアプリ =====
function App() {
  const [cases, setCases] = useState([]);
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastSync, setLastSync] = useState(null);
  const [isSyncing, setIsSyncing] = useState(false);
  const [pendingOps, setPendingOps] = useState(new Set()); // 処理中のID（削除など）
  const [isImportingFromKintone, setIsImportingFromKintone] = useState(false); // kintone インポート進行中
  const [lastKintoneImportStatus, setLastKintoneImportStatus] = useState(null); // 前回の kintone インポート結果
  // modal: null | { type:'add' } | { type:'edit', case } | { type:'delete', case }

  // GASからデータを初期読込
  useEffect(() => {
    const loadData = async () => {
      try {
        setLoading(true);
        setError(null);
        const data = await fetchFromGAS();
        setCases(data);
        setLastSync(new Date());
      } catch (err) {
        setError('データの読込に失敗しました: ' + err.message);
        console.error(err);
      } finally {
        setLoading(false);
      }
    };
    loadData();
  }, []);

  // 5分ごとに自動同期（ただし処理中の操作がある場合はスキップ）
  useEffect(() => {
    const interval = setInterval(async () => {
      try {
        // 処理中の操作がある場合はスキップ
        if (pendingOps.size > 0) {
          console.log('Skipping auto-sync due to pending operations');
          return;
        }
        const data = await fetchFromGAS();
        setCases(data);
        setLastSync(new Date());
      } catch (err) {
        console.error('Auto-sync failed:', err);
      }
    }, AUTO_SYNC_INTERVAL);
    return () => clearInterval(interval);
  }, [pendingOps]);

  // 手動同期
  const handleSync = async () => {
    try {
      setIsSyncing(true);
      setError(null);
      const data = await fetchFromGAS();
      setCases(data);
      setLastSync(new Date());
    } catch (err) {
      setError('同期に失敗しました: ' + err.message);
      console.error(err);
    } finally {
      setIsSyncing(false);
    }
  };

  // kintone からの手動インポート
  const handleKintoneImport = async () => {
    try {
      setIsImportingFromKintone(true);
      setError(null);

      // GAS の importFromKintone アクション を呼び出し
      const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=importFromKintone`, {
        method: 'POST',
        body: JSON.stringify({ action: 'importFromKintone' }),
      });
      if (!response.ok) throw new Error('API response error');

      const result = await response.json();

      if (result.success) {
        // インポート成功：データを再読込
        const data = await fetchFromGAS();
        setCases(data);
        setLastKintoneImportStatus({
          success: true,
          count: result.data.imported ? result.data.imported.length : 0,
          timestamp: new Date().toLocaleString('ja-JP'),
          message: `${result.data.imported ? result.data.imported.length : 0}件をインポート`,
        });
      } else {
        setLastKintoneImportStatus({
          success: false,
          timestamp: new Date().toLocaleString('ja-JP'),
          message: result.error || 'インポートに失敗しました',
        });
        setError(`kintone インポート失敗: ${result.error}`);
      }
    } catch (err) {
      setLastKintoneImportStatus({
        success: false,
        timestamp: new Date().toLocaleString('ja-JP'),
        message: err.message,
      });
      setError(`kintone インポートエラー: ${err.message}`);
      console.error('Kintone import error:', err);
    } finally {
      setIsImportingFromKintone(false);
    }
  };

  // ── サマリー計算（コストセンター原価は除外）──
  const budgetCases = cases.filter((c) => c.category !== 'コストセンター原価');
  const approvedBudget     = budgetCases.reduce((s, c) => s + (c.budget26  || 0), 0);
  const totalActual        = budgetCases.reduce((s, c) => s + (c.actual    || 0), 0);
  const totalForecast      = budgetCases.reduce((s, c) => s + (c.forecast  || 0), 0);
  const actualPlusForecast = totalActual + totalForecast;
  const budgetRemaining    = YEARLY_BUDGET - actualPlusForecast;

  // ── フィルタリング ──
  const filtered = cases.filter((c) => {
    if (search && !c.name.includes(search) && !c.details.includes(search)) return false;
    if (statusFilter === 'actual'   && !(c.actual   > 0)) return false;
    if (statusFilter === 'forecast' && !(c.forecast > 0)) return false;
    if (statusFilter === 'none'     && (c.actual > 0 || c.forecast > 0)) return false;
    return true;
  });

  // ── CRUD ──
  const handleSave = async (formData) => {
    try {
      const cleanData = { ...formData };
      delete cleanData.priority;
      const opId = `op-${Date.now()}-${Math.random()}`; // ユニークな操作ID

      if (modal.type === 'add') {
        // 楽観的更新：ローカルで即座に追加
        const newCase = { ...cleanData, id: nextId(cases) };
        setCases(prev => [...prev, newCase]);
        setPendingOps(prev => new Set([...prev, opId]));

        // バックグラウンドで GAS に送信
        (async () => {
          try {
            await addToGAS(cleanData);
            const data = await fetchFromGAS();
            setCases(data);
            setLastSync(new Date());
          } catch (err) {
            // エラー時：再度読込んでロールバック
            try {
              const data = await fetchFromGAS();
              setCases(data);
            } catch {}
            setError('保存に失敗しました: ' + err.message);
          } finally {
            setPendingOps(prev => {
              const newSet = new Set(prev);
              newSet.delete(opId);
              return newSet;
            });
          }
        })();
      } else {
        // 楽観的更新：ローカルで即座に更新
        setCases(prev => prev.map(c => c.id === cleanData.id ? cleanData : c));
        setPendingOps(prev => new Set([...prev, opId]));

        // バックグラウンドで GAS に送信
        (async () => {
          try {
            await updateInGAS(cleanData);
            const data = await fetchFromGAS();
            setCases(data);
            setLastSync(new Date());
          } catch (err) {
            // エラー時：再度読込んでロールバック
            try {
              const data = await fetchFromGAS();
              setCases(data);
            } catch {}
            setError('保存に失敗しました: ' + err.message);
          } finally {
            setPendingOps(prev => {
              const newSet = new Set(prev);
              newSet.delete(opId);
              return newSet;
            });
          }
        })();
      }
      setModal(null);
      setError(null);
    } catch (err) {
      setError('保存に失敗しました: ' + err.message);
      console.error(err);
    }
  };

  const handleConfirmDelete = async () => {
    try {
      const caseId = modal.case.id;

      // 楽観的更新：ローカルで即座に削除
      setCases(prev => prev.filter(c => c.id !== caseId));

      // 処理中の操作を追跡
      setPendingOps(prev => new Set([...prev, caseId]));

      // バックグラウンドで GAS に送信
      (async () => {
        try {
          await deleteFromGAS(caseId);
          // 削除成功後、サーバーから最新データを取得
          const data = await fetchFromGAS();
          setCases(data);
          setLastSync(new Date());
        } catch (err) {
          // エラー時：再度読込んでロールバック
          try {
            const data = await fetchFromGAS();
            setCases(data);
          } catch {}
          setError('削除に失敗しました: ' + err.message);
        } finally {
          // 処理中フラグを解除
          setPendingOps(prev => {
            const newSet = new Set(prev);
            newSet.delete(caseId);
            return newSet;
          });
        }
      })();

      setModal(null);
      setError(null);
    } catch (err) {
      setError('削除に失敗しました: ' + err.message);
      console.error(err);
    }
  };

  const summaryCards = [
    { label: '年間予算',    value: YEARLY_BUDGET,      color: C.muted },
    { label: '予算承認額',  value: approvedBudget,     color: C.txt },
    { label: '実績',        value: totalActual,        color: C.green },
    { label: '使用見込み',  value: totalForecast,      color: C.blue },
    { label: '実績＋見込',  value: actualPlusForecast, color: C.purple },
    { label: '予算残',      value: budgetRemaining,    color: budgetRemaining < 0 ? C.red : C.orange },
  ];

  if (loading) {
    return (
      <div style={{ minHeight: '100vh', background: C.bg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center', color: C.muted }}>
          <div style={{ fontSize: '16px', marginBottom: '10px' }}>読込中...</div>
          <div style={{ fontSize: '12px' }}>Google Sheetsからデータを取得しています</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', background: C.bg, padding: '28px 24px' }}>

      {/* エラー表示 */}
      {error && (
        <div style={{
          background: '#3b0f0f', border: `1px solid #7f1d1d`, color: '#fca5a5',
          padding: '12px 16px', borderRadius: '8px', marginBottom: '16px',
          fontSize: '13px',
        }}>
          ⚠️ {error}
        </div>
      )}

      {/* ヘッダ */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
        <div>
          <h1 style={{ fontSize: '20px', fontWeight: 700, color: C.txt, letterSpacing: '-0.02em' }}>
            データ推進部 運営費管理 2026年度
          </h1>
          <div style={{ fontSize: '12px', color: C.dim, marginTop: '3px' }}>
            データスタジアム株式会社 · データ推進部（約30名）
          </div>
        </div>
        <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
          {lastSync && (
            <div style={{ fontSize: '11px', color: C.dim }}>
              最終同期: {lastSync.toLocaleTimeString('ja-JP')}
            </div>
          )}
          <button
            onClick={handleSync}
            disabled={isSyncing}
            style={{ ...btnStyle(isSyncing ? '#334155' : C.purple), padding: '8px 14px', fontSize: '12px', opacity: isSyncing ? 0.6 : 1 }}
          >
            {isSyncing ? '同期中...' : '同期'}
          </button>
          <button
            onClick={handleKintoneImport}
            disabled={isImportingFromKintone}
            style={{
              ...btnStyle(isImportingFromKintone ? '#334155' : '#16a34a'),
              padding: '8px 14px',
              fontSize: '12px',
              opacity: isImportingFromKintone ? 0.6 : 1,
              display: 'flex',
              alignItems: 'center',
              gap: '6px',
            }}
          >
            {isImportingFromKintone ? (
              <>
                <span style={{ animation: 'spin 1s linear infinite' }}>⟳</span>
                インポート中...
              </>
            ) : (
              <>⬇ kintone から同期</>
            )}
          </button>
          {lastKintoneImportStatus && (
            <div style={{
              padding: '6px 12px',
              borderRadius: '6px',
              fontSize: '11px',
              background: lastKintoneImportStatus.success ? '#10b98110' : '#ef444410',
              color: lastKintoneImportStatus.success ? '#10b981' : '#ef4444',
              whiteSpace: 'nowrap',
            }}>
              {lastKintoneImportStatus.success ? '✓' : '✕'} {lastKintoneImportStatus.message}
            </div>
          )}
          <a
            href="https://dtsmx.cybozu.com/k/375/?view=6454508&q=f13485939%20like%20%22%E3%83%87%E3%83%BC%E3%82%BF%E6%8E%A8%E9%80%B2%22%20and%20f6454445%20%3E%3D%20%222026-03-31T15%3A00%3A00.000Z%22#sort_0=f5542296&order_0=desc&size=20"
            target="_blank"
            rel="noopener noreferrer"
            style={{ ...btnStyle(C.orange), padding: '8px 16px', fontSize: '12px', textDecoration: 'none', display: 'inline-block' }}
          >
            💰 経費申請
          </a>
          <button
            onClick={() => setModal({ type: 'add' })}
            style={{ ...btnStyle(C.indigo), padding: '10px 22px', fontSize: '14px', borderRadius: '10px' }}
          >
            ＋ 案件を追加
          </button>
        </div>
      </div>

      {/* サマリーカード 6枚 */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '14px', marginBottom: '18px' }}>
        {summaryCards.map(({ label, value, color }) => (
          <div key={label} style={cardStyle}>
            <div style={{ fontSize: '12px', color: C.dim, marginBottom: '6px' }}>{label}</div>
            <div style={{ fontSize: '22px', fontWeight: 700, color }}>{fmt(value)}</div>
          </div>
        ))}
      </div>

      {/* 予算消化バー */}
      <div style={{ ...cardStyle, marginBottom: '20px' }}>
        <ProgressBar
          label={`実績＋見込消化率 ─ ${fmt(actualPlusForecast)} / ${fmt(YEARLY_BUDGET)}`}
          value={actualPlusForecast} max={YEARLY_BUDGET} color={C.purple}
        />
        <ProgressBar
          label={`実績消化率 ─ ${fmt(totalActual)} / ${fmt(YEARLY_BUDGET)}`}
          value={totalActual} max={YEARLY_BUDGET} color={C.green}
        />
      </div>

      {/* フィルタ */}
      <div style={{ display: 'flex', gap: '10px', marginBottom: '20px', alignItems: 'center', flexWrap: 'wrap' }}>
        <input
          style={{ ...inputStyle, maxWidth: '260px' }}
          placeholder="案件名・詳細で検索..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div style={{ display: 'flex', gap: '6px' }}>
          {STATUS_FILTERS.map((f) => (
            <button key={f.value} onClick={() => setStatusFilter(f.value)}
              style={{
                ...btnStyle(statusFilter === f.value ? C.indigo : '#1e293b'),
                border: `1px solid ${statusFilter === f.value ? C.indigo : C.border}`,
                fontSize: '12px', padding: '6px 14px',
              }}
            >
              {f.label}
            </button>
          ))}
        </div>
        <span style={{ color: C.dim, fontSize: '12px', marginLeft: 'auto' }}>
          {filtered.length} 件表示
        </span>
      </div>

      {/* 案件テーブル（カテゴリ別）*/}
      <CategoryTable cases={filtered} category="予算化項目"      accentColor={C.indigo} onEdit={(c) => setModal({ type:'edit', case: c })} onDelete={(c) => setModal({ type:'delete', case: c })} />
      <CategoryTable cases={filtered} category="追加項目"        accentColor={C.green}  onEdit={(c) => setModal({ type:'edit', case: c })} onDelete={(c) => setModal({ type:'delete', case: c })} />
      <CategoryTable cases={filtered} category="コストセンター原価" accentColor={C.muted}  onEdit={null} onDelete={null} />

      {/* フッタ */}
      <div style={{ textAlign: 'center', color: C.dim, fontSize: '11px', marginTop: '32px', paddingTop: '20px', borderTop: `1px solid ${C.border}` }}>
        データ推進部 運営費管理アプリ ─ フェーズ② Google Sheets連携版
      </div>

      {/* モーダル */}
      {(modal?.type === 'add' || modal?.type === 'edit') && (
        <FormModal
          initial={modal.type === 'edit' ? modal.case : null}
          onSave={handleSave}
          onClose={() => setModal(null)}
        />
      )}
      {modal?.type === 'delete' && (
        <DeleteModal
          caseName={modal.case.name}
          onConfirm={handleConfirmDelete}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
